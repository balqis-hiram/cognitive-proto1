<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RULE SWITCH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap');

:root{
  /* 書体を変えるならこの2行だけ */
  --fJP:'M PLUS Rounded 1c',system-ui,sans-serif;
  --fDisp:'Baloo 2','M PLUS Rounded 1c',sans-serif;

  --bg:#FFF3D6; --stage:#FFFBEF; --panel:#FFFFFF;
  --stroke:#221E18; --ink:#221E18; --dim:#6E665A; --track:#EDE4CE;
  --cell:#00000008; --cellLine:#221E1826;

  --blue:#1B6EF3;  --blue-lt:#5E9BFF;
  --amber:#FF8A00; --amber-lt:#FFB44D;
  --violet:#7C3AED;--violet-lt:#A97BFF;
  --good:#12B886;  --bad:#FF4D5E;

  --hard:6px 6px 0 var(--stroke);
  --hard-sm:4px 4px 0 var(--stroke);
  --bw:4px;
}
body[data-theme="dark"]{
  --bg:#12131C; --stage:#1A1C28; --panel:#232636;
  --stroke:#FFF6E0; --ink:#FFF6E0; --dim:#9AA0B5; --track:#2E3244;
  --cell:#FFFFFF08; --cellLine:#FFF6E026;

  --blue:#4D9BFF;  --blue-lt:#8CC0FF;
  --amber:#FFB03A; --amber-lt:#FFD27A;
  --violet:#B98BFF;--violet-lt:#D4B8FF;
  --good:#3EE0A8;  --bad:#FF6B7D;
}

/* ============================================================
   かさなりの順番（z-index）
   数字が大きいほど手前に表示されます。
   画面を新しく足すときは、下敷きにしたくない相手より
   大きい数字を書けばOKです。

      20  歯車ボタン
      18  設定画面
      16  中断ボタン
      14  スタート／パート導入／カウントダウン／結果
      12  紙吹雪・ふきだし・ルールチェンジ
       5  ルール表示・正誤の光る枠
       4  的とリング
       2  外枠
   ============================================================ */

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--fJP);font-weight:700;
  -webkit-font-smoothing:antialiased;user-select:none;transition:background .3s,color .3s}
.dp{font-family:var(--fJP);font-weight:900}
.num{font-family:var(--fDisp);font-weight:800;font-feature-settings:"tnum"}

.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--stage);transition:background .3s}
.stage-frame{position:absolute;inset:16px;border:var(--bw) solid var(--stroke);border-radius:24px;
  pointer-events:none;z-index:2}

/* ---------- chrome ---------- */
.chrome{transition:opacity .25s}
body.playing .chrome{opacity:0;pointer-events:none}
.brand{position:absolute;top:2.6vh;left:4vh;z-index:20;
  font-family:var(--fJP);font-weight:900;font-size:clamp(13px,2vh,20px);
  color:var(--ink);background:var(--panel);border:var(--bw) solid var(--stroke);border-radius:100px;
  padding:1.1vh 2.6vh;cursor:pointer;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
.brand:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--stroke)}
.gear{position:absolute;top:2.6vh;right:4vh;z-index:20;
  font-family:var(--fJP);font-weight:900;font-size:clamp(15px,2.3vh,23px);
  color:var(--ink);background:var(--panel);border:var(--bw) solid var(--stroke);border-radius:100px;
  padding:1.3vh 3.2vh;cursor:pointer;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
.gear:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--stroke)}

/* センサー操作を想定し、選択肢は大きく。1つあたり最低9vh確保 */
.setTitle{font-weight:900;font-size:clamp(24px,4.4vh,48px);margin-bottom:2.6vh}
.setBlock{margin-bottom:2.4vh;text-align:left}
.setLabel{font-size:clamp(13px,2.2vh,20px);font-weight:700;letter-spacing:.16em;color:var(--dim);margin-bottom:1vh}
.optRow{display:flex;gap:1.6vh}
.opt{flex:1;min-height:9vh;padding:1.4vh 1vh;cursor:pointer;
  font-family:var(--fJP);font-weight:900;font-size:clamp(15px,2.7vh,27px);line-height:1.15;
  color:var(--ink);background:var(--panel);border:var(--bw) solid var(--stroke);border-radius:18px;
  box-shadow:var(--hard-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vh;
  transition:transform .12s,box-shadow .12s}
.opt small{font-size:.58em;font-weight:500;color:var(--dim);letter-spacing:.02em}
.opt:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--stroke)}
.opt.on{background:var(--violet);color:#fff}
.opt.on small{color:#fff;opacity:.85}
.setNote{font-size:clamp(11px,1.8vh,16px);font-weight:500;color:var(--dim);line-height:1.6;
  margin-bottom:2.6vh;text-align:left}

/* 中断。誤爆を避けるため長押し2秒。センサーでは「隅を指し続ける」は意図的にしか起きない */
.abort{display:none;position:absolute;top:3vh;left:4vh;z-index:16;overflow:hidden;
  font-family:var(--fJP);font-weight:700;font-size:clamp(12px,1.9vh,18px);color:var(--dim);
  background:var(--panel);border:3px solid var(--cellLine);border-radius:100px;
  padding:1.1vh 2.4vh;cursor:pointer}
body.playing .abort{display:block}
.afill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--bad);opacity:.3}
.atxt{position:relative}

/* ---------- 中央ハブ：ホーム兼ルール表示 ---------- */
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:32%;aspect-ratio:1;border-radius:50%;z-index:5;
  border:var(--bw) solid var(--stroke);box-shadow:var(--hard);background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;transition:background .3s}
.hub.byColor{background:color-mix(in srgb,var(--blue) 12%,var(--panel))}
.hub.byShape{background:color-mix(in srgb,var(--amber) 15%,var(--panel))}
.hubBig{font-weight:900;font-size:clamp(46px,11vh,118px);line-height:1}
.hub.byColor .hubBig{color:var(--blue)}
.hub.byShape .hubBig{color:var(--amber)}
.hubSml{font-weight:700;font-size:clamp(15px,3.1vh,33px);line-height:1.2;margin-top:.6vh}
.hubSw{font-weight:900;font-size:clamp(17px,3.3vh,34px);line-height:1.25;color:#fff}
.hub.switching{background:var(--violet);animation:hubPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes hubPop{0%{transform:translate(-50%,-50%) scale(1)}
  45%{transform:translate(-50%,-50%) scale(1.12)}
  100%{transform:translate(-50%,-50%) scale(1)}}

/* ---------- リング配置：ホームから等距離の8ゾーン ---------- */
.field{position:absolute;left:16px;right:16px;top:5vh;bottom:6vh;z-index:4;
  display:flex;align-items:center;justify-content:center}
/* 正方形にしないと縦横で半径が変わり「等距離」が崩れる */
.ring{position:relative;height:100%;aspect-ratio:1;max-width:100%;max-height:100%}
.cell{position:absolute;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:3px solid var(--cellLine);border-radius:20px;background:var(--cell);
  display:flex;align-items:center;justify-content:center}

.target{position:absolute;height:72%;aspect-ratio:1;cursor:pointer;
  transform:scale(.2);opacity:0;transition:transform .3s cubic-bezier(.2,1.7,.4,1),opacity .18s}
.target.show{transform:scale(1);opacity:1}
.target::after{content:'';position:absolute;inset:-16%;border-radius:26%}
.target.show .shape{animation:bob var(--bobDur,3.4s) ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
.c-blue{--fill:var(--blue);--fg:var(--blue-lt)}
.c-amber{--fill:var(--amber);--fg:var(--amber-lt)}
.shape{width:100%;height:100%;position:relative;
  background:linear-gradient(160deg,var(--fg),var(--fill));
  border:var(--bw) solid var(--stroke);box-shadow:var(--hard);
  display:flex;align-items:center;justify-content:center}
.s-circle{border-radius:50%}
.s-square{border-radius:20px}

.fuse{position:absolute;left:-9%;top:-9%;width:118%;height:118%;
  transform:rotate(-90deg);pointer-events:none;z-index:0;overflow:visible}
.fuse circle{fill:none;stroke:var(--violet);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:289;stroke-dashoffset:0;opacity:.55}
.target.show .fuse circle{animation-name:fuse;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes fuse{to{stroke-dashoffset:289}}
.target.hit .fuse,.target.miss .fuse{opacity:0;transition:opacity .1s}

/* かお */
.face{position:relative;width:56%;height:40%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14%}
.eyes{display:flex;gap:26%;width:74%;justify-content:center}
.eyes i{width:13%;min-width:8px;aspect-ratio:1/1.35;background:#221E18;border-radius:50%;transition:all .12s}
.mouth{width:30%;height:16%;min-height:7px;border-bottom:5px solid #221E18;border-radius:0 0 60% 60%;transition:all .12s}
.target.hit .eyes i{aspect-ratio:1/.4;border-radius:2px}
.target.hit .mouth{width:44%;height:26%;border-bottom-width:7px}
.target.miss .eyes i{aspect-ratio:1/.35;border-radius:2px;transform:rotate(28deg)}
.target.miss .eyes i:last-child{transform:rotate(-28deg)}
.target.miss .mouth{border-bottom:none;border-top:5px solid #221E18;border-radius:60% 60% 0 0}
.target.hit .shape{animation:hit .45s cubic-bezier(.2,1.6,.4,1) forwards}
.target.miss .shape{animation:miss .5s ease forwards}
@keyframes hit{0%{transform:scale(1)}35%{transform:scale(1.22) rotate(6deg)}100%{transform:scale(0) rotate(20deg);opacity:0}}
@keyframes miss{0%{transform:scale(1)}15%{transform:translateX(-11px) rotate(-5deg)}30%{transform:translateX(11px) rotate(5deg)}45%{transform:translateX(-8px)}60%{transform:translateX(8px)}100%{transform:scale(.85);opacity:0}}

/* ---------- FX ---------- */
.conf{position:absolute;width:13px;height:13px;pointer-events:none;z-index:11;border:2px solid var(--stroke)}
@keyframes cfly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.popText{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(.5);
  font-family:var(--fJP);font-weight:900;font-size:clamp(34px,6vh,74px);opacity:0;z-index:11;
  pointer-events:none;-webkit-text-stroke:4px var(--stroke);paint-order:stroke fill}
.popText.go{animation:pt .75s cubic-bezier(.2,1.6,.4,1)}
@keyframes pt{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  22%{opacity:1;transform:translate(-50%,-58%) scale(1.1)}
  70%{opacity:1;transform:translate(-50%,-60%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-76%) scale(.95)}}
.combo{position:absolute;top:3.6vh;right:5vh;z-index:10;
  font-family:var(--fJP);font-weight:900;font-size:clamp(17px,2.6vh,30px);color:#fff;
  background:var(--good);border:var(--bw) solid var(--stroke);border-radius:100px;
  padding:.8vh 2.4vh;box-shadow:var(--hard-sm);opacity:0;transform:scale(.6) rotate(-4deg);transition:opacity .2s}
.combo.on{opacity:1;animation:cb .4s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes cb{0%{transform:scale(.6) rotate(-10deg)}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(-3deg)}}
.flash{position:absolute;inset:16px;border-radius:24px;pointer-events:none;z-index:5;opacity:0}
.flash.good{box-shadow:inset 0 0 0 9px var(--good);animation:fl .45s ease}
.flash.bad{box-shadow:inset 0 0 0 9px var(--bad);animation:fl .45s ease}
@keyframes fl{0%{opacity:1}100%{opacity:0}}

.prog{position:absolute;left:5vh;right:5vh;bottom:3.4vh;height:12px;z-index:6;
  background:var(--track);border:3px solid var(--stroke);border-radius:100px;overflow:hidden}
.prog>span{display:block;height:100%;width:0;background:var(--violet);transition:width .35s ease}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:16px;z-index:14;display:flex;align-items:center;justify-content:center;
  background:var(--stage);border-radius:20px;overflow:auto}
.overlay.hidden{display:none}
/* 設定は他のオーバーレイより手前。同値だとDOM順で下敷きになる */
#setScreen{z-index:18}
@media (max-width:560px){.res-grid{grid-template-columns:1fr}}
.pc{text-align:center;max-width:1080px;padding:2.4vh 24px;margin:auto}

.bigTitle{font-family:var(--fDisp);font-weight:800;font-size:clamp(40px,11vh,124px);line-height:.9;
  margin-bottom:1.6vh;color:var(--violet);-webkit-text-stroke:5px var(--stroke);paint-order:stroke fill}
.bigSub{font-weight:900;font-size:clamp(19px,3.6vh,42px);margin-bottom:2.6vh}
.bigSub .hl{color:var(--violet)}
.trains{display:inline-flex;align-items:center;gap:14px;margin-bottom:3vh;
  border:var(--bw) solid var(--stroke);border-radius:100px;padding:1vh 2.8vh;
  background:var(--panel);box-shadow:var(--hard-sm)}
.trains .tk{font-size:clamp(11px,1.6vh,16px);letter-spacing:.2em;color:var(--dim)}
.trains .tv{font-weight:900;font-size:clamp(17px,2.9vh,29px);color:var(--violet)}
.rulepair{display:flex;gap:2.2vh;justify-content:center;margin-bottom:2vh;flex-wrap:wrap}
.rp{width:min(280px,38vw);background:var(--panel);border:var(--bw) solid var(--stroke);
  border-radius:20px;padding:2.2vh 2vh;cursor:pointer;box-shadow:var(--hard);
  transition:transform .12s,box-shadow .12s}
.rp:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--stroke)}
.rp h4{font-weight:900;font-size:clamp(18px,3vh,30px);margin-bottom:.6vh}
.rp.byColor h4{color:var(--blue)} .rp.byShape h4{color:var(--amber)}
.rp .rl{font-size:clamp(14px,2.2vh,22px)}
.detail{min-height:5.2vh;font-size:clamp(13px,2vh,20px);line-height:1.6;color:var(--dim);
  margin-bottom:2.4vh;opacity:0;transition:opacity .22s;font-weight:500}
.detail.on{opacity:1}

.btn{font-family:var(--fJP);font-weight:900;font-size:clamp(17px,2.9vh,29px);color:#fff;
  background:var(--violet);border:var(--bw) solid var(--stroke);border-radius:100px;
  padding:1.7vh 6vh;cursor:pointer;box-shadow:var(--hard);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--stroke)}
.btn:focus-visible{outline:4px dashed var(--violet);outline-offset:6px}
.btn.ghost{background:var(--panel);color:var(--ink);font-size:clamp(13px,2vh,19px);padding:1.4vh 3.2vh}

.countdown{font-family:var(--fDisp);font-weight:800;font-size:min(30vh,250px);color:var(--violet);
  -webkit-text-stroke:7px var(--stroke);paint-order:stroke fill;animation:cd 1s ease-in-out}
@keyframes cd{0%{transform:scale(1.5) rotate(-8deg);opacity:0}30%{opacity:1}100%{transform:scale(.65) rotate(6deg);opacity:0}}
.blkNo{font-family:var(--fDisp);font-weight:800;font-size:clamp(13px,2vh,20px);letter-spacing:.24em;color:var(--dim);margin-bottom:2vh}
.blkTitle{font-weight:900;font-size:clamp(34px,8vh,92px);line-height:1.1;margin-bottom:2vh}
.blkSub{font-size:clamp(15px,2.4vh,24px);color:var(--dim);font-weight:500}

/* ---------- result ---------- */
.resTitle{font-weight:900;font-size:clamp(22px,4.2vh,50px);line-height:1.15;margin-bottom:2.2vh}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5vh;margin-bottom:2vh}
.res{background:var(--panel);border:var(--bw) solid var(--stroke);border-radius:16px;
  padding:1.8vh 1.7vh;text-align:left;box-shadow:var(--hard-sm)}
.res .rk{font-weight:900;font-size:clamp(15px,2.4vh,25px);line-height:1.2}
.res .rt2{font-family:var(--fDisp);font-weight:800;font-size:clamp(9px,1.25vh,13px);
  letter-spacing:.1em;color:var(--dim);margin-bottom:.8vh}
.res .rd{font-size:clamp(11px,1.55vh,16px);font-weight:500;color:var(--dim);line-height:1.5;margin-bottom:1.2vh}
.res .rv{font-family:var(--fDisp);font-weight:800;font-size:clamp(28px,5vh,56px);line-height:1}
.res .ru{font-family:var(--fJP);font-weight:700;font-size:clamp(11px,1.6vh,17px);color:var(--dim);margin-left:5px}
.res .rb{margin-top:1vh;height:9px;border-radius:100px;background:var(--track);border:2px solid var(--stroke);overflow:hidden}
.res .rbf{height:100%}
.resNote{font-size:clamp(10px,1.5vh,14px);font-weight:500;color:var(--dim);margin-bottom:2.2vh;line-height:1.65}

@media (max-width:900px){.res-grid{grid-template-columns:repeat(2,1fr)}}
.reduced *{animation:none!important;transition:none!important}
</style>
</head>
<body data-theme="light">

<div class="stage" id="stage">
  <div class="stage-frame"></div>
  <button class="brand chrome" id="homeBtn">← ホーム</button>
  <button class="gear chrome" id="gearBtn">⚙ 設定</button>

  <button class="abort" id="abortBtn"><span class="afill" id="abortFill"></span><span class="atxt">長押しで中断</span></button>

  <div class="combo" id="combo"></div>
  <div class="popText" id="popText"></div>

  <div class="field" id="field"><div class="ring" id="ring">
    <div class="hub byColor" id="hub"><span class="hubBig">青</span><span class="hubSml">にタッチ</span></div>
  </div></div>
  <div class="flash" id="flash"></div>
  <div class="prog"><span id="progBar"></span></div>

  <!-- START -->
  <div class="overlay hidden" id="setScreen">
    <div class="pc" style="max-width:860px">
      <div class="setTitle">設定</div>
      <div class="setBlock">
        <div class="setLabel">ペース</div>
        <div class="optRow" id="segPace">
          <button class="opt on" data-v="slow">ゆっくり<small>体を動かす</small></button>
          <button class="opt" data-v="normal">ふつう<small>立って手を伸ばす</small></button>
          <button class="opt" data-v="fast">はやい<small>画面タッチ</small></button>
        </div>
      </div>
      <div class="setBlock">
        <div class="setLabel">画面</div>
        <div class="optRow" id="segTheme">
          <button class="opt on" data-v="light">あかるい<small>ディスプレイ向け</small></button>
          <button class="opt" data-v="dark">くらい<small>投影向け</small></button>
        </div>
      </div>
      <div class="setBlock">
        <div class="setLabel">効果音</div>
        <div class="optRow" id="segSfx">
          <button class="opt on" data-v="on">ON</button><button class="opt" data-v="off">OFF</button>
        </div>
      </div>
      <div class="setBlock">
        <div class="setLabel">BGM</div>
        <div class="optRow" id="segBgm">
          <button class="opt on" data-v="on">ON</button><button class="opt" data-v="off">OFF</button>
        </div>
      </div>
      <div class="setNote">BGMのビートは動作のテンポを引っぱります。反応時間を記録として使う回はOFFを推奨。</div>
      <button class="btn" id="setCloseBtn">閉じる</button>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="pc">
      <div class="bigTitle">RULE SWITCH</div>
      <div class="bigSub">ルールが<span class="hl">途中で変わる</span>。</div>
      <div class="trains"><span class="tk">きたえる力</span><span class="tv">認知的柔軟性</span></div>
      <div class="rulepair">
        <div class="rp byColor" data-mode="color"><h4>色モード</h4><div class="rl">青にタッチ</div></div>
        <div class="rp byShape" data-mode="shape"><h4>形モード</h4><div class="rl">丸にタッチ</div></div>
      </div>
      <div class="detail" id="detail"></div>
      <button class="btn" id="startBtn">はじめる</button>
    </div>
  </div>

  <div class="overlay hidden" id="blkScreen">
    <div class="pc">
      <div class="blkNo" id="blkNo">PART 1 / 3</div>
      <div class="blkTitle" id="blkTitle"></div>
      <div class="blkSub" id="blkSub"></div>
    </div>
  </div>

  <div class="overlay hidden" id="cdScreen"><div class="countdown" id="cdNum">3</div></div>

  <div class="overlay hidden" id="resScreen">
    <div class="pc">
      <div class="resTitle">認知的柔軟性を鍛えました。</div>
      <div class="res-grid" id="resGrid"></div>
      <div class="resNote" id="resNote"></div>
      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="againBtn">もう一度</button>
        <button class="btn ghost" id="homeBtn2">ホームへ</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
if(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches)
  document.body.classList.add('reduced');

/* ===================== 設定値 ===================== */
const PURE_TRIALS = 8;    // 単一ルール × 2パート
const MIXED_TRIALS = 24;  // ルール混在パート
const TOTAL = PURE_TRIALS*2 + MIXED_TRIALS;

const PACES={

/* ===================== audio ===================== */
let actx=null, master=null, sfxOn=true, bgmOn=true, noiseBuf=null;
function AC(){
  if(!actx){
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=1;master.connect(actx.destination);
    const n=actx.sampleRate*0.4, b=actx.createBuffer(1,n,actx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    noiseBuf=b;
  }
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function tone(freqs,dur,type,vol,when){
  if(!sfxOn)return;
  try{const a=AC(),t=when||a.currentTime;
    freqs.forEach((f,i)=>{
      const o=a.createOscillator(),g=a.createGain();
      o.type=type;o.frequency.value=f;
      const t0=t+i*dur*0.55;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(vol,t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.02);
    });}catch(e){}
}
const sGood=()=>tone([784,1175],0.13,'triangle',0.18);
const sBad =()=>tone([200,150],0.20,'sawtooth',0.11);
const sSwit=()=>tone([523,659,880],0.16,'square',0.12);
const sCombo=n=>tone([880+n*70],0.10,'sine',0.14);

/* ---- 手続き生成BGM：キック／ハット／ベース／アルペジオ ---- */
const bgm={playing:false,timer:null,step:0,next:0,gain:null};
const PROG=[110.00, 87.31, 130.81, 98.00];            // Am - F - C - G
const PENTA=[440.00,523.25,587.33,659.25,783.99,880.00]; // Aマイナーペンタ
function kick(t){const a=AC(),o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+0.11);
  g.gain.setValueAtTime(0.34,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
  o.connect(g);g.connect(bgm.gain);o.start(t);o.stop(t+0.24);}
function hat(t,v){const a=AC(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.045);
  s.connect(f);f.connect(g);g.connect(bgm.gain);s.start(t);s.stop(t+0.06);}
function clap(t){const a=AC(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=1800;f.Q.value=1.2;
  g.gain.setValueAtTime(0.16,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  s.connect(f);f.connect(g);g.connect(bgm.gain);s.start(t);s.stop(t+0.15);}
function bass(t,f,d){const a=AC(),o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
  o.type='triangle';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=700;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.20,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(lp);lp.connect(g);g.connect(bgm.gain);o.start(t);o.stop(t+d+0.02);}
function arp(t,f){const a=AC(),o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.055,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  o.connect(g);g.connect(bgm.gain);o.start(t);o.stop(t+0.18);}

function bgmStart(){
  if(!bgmOn||bgm.playing)return;
  const a=AC();
  bgm.gain=a.createGain();bgm.gain.gain.value=0;bgm.gain.connect(master);
  bgm.gain.gain.linearRampToValueAtTime(0.5,a.currentTime+1.2);
  bgm.playing=true;bgm.step=0;bgm.next=a.currentTime+0.1;
  bgm.timer=setInterval(schedule,25);
}
function bgmStop(){
  if(!bgm.playing)return;
  clearInterval(bgm.timer);bgm.playing=false;
  try{const a=AC();bgm.gain.gain.linearRampToValueAtTime(0,a.currentTime+0.6);
    const g=bgm.gain;setTimeout(()=>g.disconnect(),800);}catch(e){}
}
function schedule(){
  const a=AC(), spb=60/pace.bpm, sixteenth=spb/4;
  while(bgm.next < a.currentTime + 0.12){
    const s=bgm.step%16, bar=Math.floor(bgm.step/16)%4, t=bgm.next, root=PROG[bar];
    if(s===0||s===6||s===8||s===14) kick(t);
    if(s===4||s===12) clap(t);
    if(s%2===0) hat(t, s%4===0?0.05:0.03);
    if(s===0||s===8) bass(t,root,spb*0.9);
    if(s===6||s===14) bass(t,root*1.5,spb*0.4);
    if(s===2||s===5||s===10||s===13) arp(t, PENTA[(bgm.step*3+bar)%PENTA.length]);
    bgm.next+=sixteenth;bgm.step++;
  }
}

/* ===================== state ===================== */
let state,current,shownAt,trialTimer,curRule,justSwitched,combo,blockShown=-1;
/* セッションごとに増える識別子。中断時にこれを進めると、
   予約済みのタイマーはすべて自分の番号が古いことに気づいて何もしない */
let runId=0;
const later=(fn,ms)=>{const id=runId;return setTimeout(()=>{if(id===runId)fn();},ms);};

function buildSeq(){
  const seq=[];
  const pureFirst=Math.random()<.5?'color':'shape';
  const pureSecond=pureFirst==='color'?'shape':'color';

  // 8ゾーンを袋から引く（同じゾーンの連続は避ける）ので出現位置が偏らない
  let bag=[],lastCell=-1;
  const nextCell=()=>{
    if(!bag.length) bag=[...Array(CELLS).keys()].sort(()=>Math.random()-.5);
    let i=bag.findIndex(p=>p!==lastCell); if(i<0)i=0;
    const p=bag.splice(i,1)[0]; lastCell=p; return p;
  };
  const push=(rule,block,part,opt)=>{
    const t=Object.assign({rule,block,part,switch:false,warmup:false},opt||{});
    t.color=Math.random()<.5?'blue':'amber';
    t.shape=Math.random()<.5?'circle':'square';
    t.cell=nextCell();
    t.correct = rule==='color' ? t.color==='blue' : t.shape==='circle';
    seq.push(t);
  };

  for(let i=0;i<PURE_TRIALS;i++) push(pureFirst,'pure',1,{warmup:i===0});
  for(let i=0;i<PURE_TRIALS;i++) push(pureSecond,'pure',2,{warmup:i===0});

  let rule=pureSecond, run=0, blockLen=rand(3,5);
  for(let i=0;i<MIXED_TRIALS;i++){
    let sw=false;
    if(i>0 && run>=blockLen && i<MIXED_TRIALS-1){
      rule=rule==='color'?'shape':'color';run=0;blockLen=rand(3,5);sw=true;
    }
    push(rule,'mixed',3,{switch:sw,warmup:i===0});
    run++;
  }
  return seq;
}

function reset(){
  state={idx:0,correct:0,total:0,persev:0,switchCount:0,
    pureRTs:[],mixRepeatRTs:[],mixSwitchRTs:[],allRTs:[],maxCombo:0,log:[]};
  combo=0;justSwitched=false;blockShown=-1;
  state.seq=buildSeq();
  setRule(state.seq[0].rule,false);
  progBar.style.width='0%';
}

function paintHub(rule){
  const c=rule==='color';
  hub.className='hub '+(c?'byColor':'byShape');
  hub.innerHTML='<span class="hubBig">'+(c?'青':'丸')+'</span><span class="hubSml">にタッチ</span>';
}
function setRule(rule,animate){
  curRule=rule;                       // 判定は即座に切り替える
  if(animate){
    hub.className='hub switching';
    hub.innerHTML='<span class="hubSw">ルール<br>チェンジ！</span>';
    sSwit();
    // 告知のあと、的が出るより前に新ルールを出す
    later(()=>paintHub(rule), Math.min(750, pace.swPause*0.55));
  }else{
    paintHub(rule);
  }
}

/* ---- 中断（長押し2秒） ---- */
const abortBtn=$('abortBtn'),abortFill=$('abortFill');
let holdT=null;
abortBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  abortFill.style.transition='width 2s linear';abortFill.style.width='100%';
  holdT=setTimeout(abortSession,2000);
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>
  abortBtn.addEventListener(ev,()=>{
    if(holdT){clearTimeout(holdT);holdT=null;}
    abortFill.style.transition='width .18s';abortFill.style.width='0%';
  }));

function abortSession(){
  holdT=null;
  abortFill.style.transition='none';abortFill.style.width='0%';
  runId++;                                  // 予約済みタイマーをすべて無効化
  clearTimeout(trialTimer);
  current=null;
  document.querySelectorAll('.target').forEach(el=>el.remove());
  bgmStop();hideCombo();
  document.body.classList.remove('playing');
  hide(blkScreen);hide(cdScreen);hide(resScreen);
  progBar.style.width='0%';
  reset();show(startScreen);
  tone([440,330],0.16,'triangle',0.10);
}

function blockInfoFor(i){
  const t=state.seq[i];
  if(t.part===3) return {no:'PART 3 / 3',title:'ルールが 変わる！',
    sub:'色モードと形モードが入れかわります。今のルールをよく見て。'};
  return {no:'PART '+t.part+' / 3',
    title:t.rule==='color'?'色モード だけ':'形モード だけ',
    sub:t.rule==='color'?'青にタッチ。ルールは変わりません。':'丸にタッチ。ルールは変わりません。'};
}
function runBlockIntro(i){
  const info=blockInfoFor(i);
  $('blkNo').textContent=info.no;$('blkTitle').textContent=info.title;$('blkSub').textContent=info.sub;
  show(blkScreen);
  later(()=>{hide(blkScreen);countdown();},pace.intro);
}
function countdown(){
  show(cdScreen);
  const id=runId;
  let n=3;cdNum.textContent=n;bump();
  const iv=setInterval(()=>{
    if(id!==runId){clearInterval(iv);return;}
    n--;if(n===0){clearInterval(iv);hide(cdScreen);nextTrial();return;}
    cdNum.textContent=n;bump();},pace.cd);
}
function bump(){cdNum.style.animation='none';void cdNum.offsetWidth;cdNum.style.animation='';}

function nextTrial(){
  if(state.idx>=TOTAL) return finish();
  const t=state.seq[state.idx], prev=state.seq[state.idx-1];
  if(prev && prev.part!==t.part && blockShown!==state.idx){
    blockShown=state.idx; return runBlockIntro(state.idx);
  }
  if(t.switch){
    setRule(t.rule,true);state.switchCount++;justSwitched=true;
    later(()=>spawn(t),pace.swPause);
  }else{
    setRule(t.rule,false);justSwitched=false;spawn(t);
  }
}

function spawn(t){
  const el=document.createElement('div');
  el.className='target c-'+t.color;
  el.innerHTML='<svg class="fuse" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"></circle></svg>'+
    '<div class="shape '+(t.shape==='circle'?'s-circle':'s-square')+'">'+
    '<div class="face"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div></div>';
  cells[t.cell].appendChild(el);
  el.querySelector('.fuse circle').style.animationDuration=pace.deadline+'ms';
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  current={el,t,answered:false};shownAt=performance.now();
  el.addEventListener('pointerdown',onHit);
  trialTimer=setTimeout(onTimeout,pace.deadline);
}

function record(t,rt,resp){
  // 生ログ。ゾーン番号も残す（全ゾーン等距離なので距離補正は不要だが、方向の偏りは検証できる）
  state.log.push({i:state.idx,part:t.part,rule:t.rule,sw:t.switch,warm:t.warmup,
    cell:t.cell,color:t.color,shape:t.shape,go:t.correct,resp,rt,pace:paceKey});
  if(rt===null)return;
  state.allRTs.push(rt);
  if(t.warmup)return;
  if(t.block==='pure') state.pureRTs.push(rt);
  else if(t.switch) state.mixSwitchRTs.push(rt);
  else state.mixRepeatRTs.push(rt);
}

function onHit(e){
  if(!current||current.answered)return;current.answered=true;clearTimeout(trialTimer);
  const r=stage.getBoundingClientRect();
  const t=current.t, rt=Math.round(performance.now()-shownAt);
  if(t.correct){
    record(t,rt,'hit');state.correct++;state.total++;
    current.el.classList.add('hit');doFlash('good');confetti(e.clientX-r.left,e.clientY-r.top);
    combo++;state.maxCombo=Math.max(state.maxCombo,combo);sGood();
    if(combo>=3){showCombo(combo);sCombo(Math.min(combo,8));}
    pop(rt<pace.deadline*0.35?'ナイス！':'せいかい！',cv('--good'));
  }else{
    const otherWants = curRule==='color' ? (t.shape==='circle') : (t.color==='blue');
    if(otherWants && justSwitched) state.persev++;
    record(t,null,'falseAlarm');
    state.total++;current.el.classList.add('miss');doFlash('bad');
    combo=0;hideCombo();sBad();pop('ちがうよ',cv('--bad'));
  }
  after();
}
function onTimeout(){
  if(!current||current.answered)return;current.answered=true;
  const t=current.t;
  if(!t.correct){
    record(t,null,'correctReject');
    state.correct++;state.total++;current.el.classList.add('hit');doFlash('good');
    combo++;state.maxCombo=Math.max(state.maxCombo,combo);sGood();
    if(combo>=3){showCombo(combo);sCombo(Math.min(combo,8));}
    pop('がまん！',cv('--good'));
  }else{
    record(t,null,'miss');
    state.total++;current.el.classList.add('miss');doFlash('bad');
    combo=0;hideCombo();sBad();pop('おしい！',cv('--amber'));
  }
  after();
}
function after(){
  const el=current&&current.el;setTimeout(()=>{if(el)el.remove()},460);
  state.idx++;progBar.style.width=(state.idx/TOTAL*100)+'%';
  later(nextTrial,pace.iti);
}
function doFlash(k){flash.className='flash '+k;void flash.offsetWidth;flash.classList.add(k);
  setTimeout(()=>flash.className='flash',480);}
function pop(txt,color){popText.textContent=txt;popText.style.color=color;
  popText.classList.remove('go');void popText.offsetWidth;popText.classList.add('go');}
function showCombo(n){comboEl.textContent=n+' れんぞく！';
  comboEl.classList.remove('on');void comboEl.offsetWidth;comboEl.classList.add('on');}
function hideCombo(){comboEl.classList.remove('on');}
function confetti(x,y){
  if(document.body.classList.contains('reduced'))return;
  const cols=['#FFD43B','#4DD4AC','#FF8FA3','#74C0FC',cv('--violet'),cv('--amber')];
  for(let i=0;i<12;i++){
    const c=document.createElement('div');c.className='conf';
    const a=Math.random()*Math.PI*2,d=70+Math.random()*130;
    c.style.left=x+'px';c.style.top=y+'px';c.style.background=cols[i%cols.length];
    c.style.borderRadius=Math.random()<.5?'50%':'3px';
    c.style.setProperty('--dx',Math.cos(a)*d+'px');
    c.style.setProperty('--dy',(Math.sin(a)*d+90)+'px');
    c.style.setProperty('--rot',rand(-540,540)+'deg');
    c.style.animation='cfly .85s cubic-bezier(.15,.7,.3,1) forwards';
    stage.appendChild(c);setTimeout(()=>c.remove(),900);
  }
}

/* ===================== result ===================== */
const METRICS=[
  {id:'flex',k:'認知的柔軟性',t:'FLEXIBILITY',d:'切り替えへの適応を総合したスコア。',u:'',c:'--violet'},
  {id:'lc'  ,k:'切り替えの遅れ',t:'LOCAL SWITCH COST',d:'ルールが変わった直後の遅れ。',u:'ms',c:'--amber'},
  {id:'mc'  ,k:'混在の負荷',t:'MIXING COST',d:'2つのルールを保持する重さ。',u:'ms',c:'--blue'},
  {id:'pe'  ,k:'ひきずり',t:'PERSEVERATION',d:'前のルールのまま反応した回数。',u:'回',c:'--bad'},
  {id:'rt'  ,k:'平均反応時間',t:'REACTION TIME',d:'的が出てからタッチまで。',u:'ms',c:'--good'},
  {id:'acc' ,k:'正答率',t:'ACCURACY',d:'全試行の正答割合。',u:'%',c:'--good'}
];
const signed=v=>v===null?'—':(v>0?'+':'')+v;
const barPct={
  flex:v=>v===null?0:v,
  lc  :v=>v===null?0:Math.max(6,Math.min(100,100-Math.abs(v)/5)),
  mc  :v=>v===null?0:Math.max(6,Math.min(100,100-Math.abs(v)/5)),
  pe  :v=>v===null?0:Math.max(6,100-v*20),
  rt  :v=>v===null?0:Math.max(8,Math.min(100,(1600-v)/1100*100)),
  acc :v=>v===null?0:v
};
function renderCards(el,sum){
  el.innerHTML=METRICS.map(m=>{
    const v=sum[m.id];
    const txt=(m.id==='lc'||m.id==='mc')?signed(v):(v===null?'—':v);
    return `<div class="res"><div class="rk">${m.k}</div><div class="rt2">${m.t}</div>
      <div class="rd">${m.d}</div>
      <div class="rv">${txt}<span class="ru">${m.u}</span></div>
      <div class="rb"><div class="rbf" style="width:${barPct[m.id](v)}%;background:${cv(m.c)}"></div></div></div>`;
  }).join('');
}

function noteFor(sum){
  const p=PACES[sum.pace];
  return 'ペース：<b>'+p.label+'</b>（反応可能時間 '+p.deadline+'ms）／ BGM：<b>'+(sum.bgm?'ON':'OFF')+'</b>　'+
    '経過を追うときは同じ設定で比べてください。デモ試行数のため数値は参考値です。';
}
let lastSummary=null;
function finish(){
  document.body.classList.remove('playing');
  bgmStop();
  const acc=state.total?Math.round(state.correct/state.total*100):0;
  const pureA=avg(state.pureRTs),rep=avg(state.mixRepeatRTs),sw=avg(state.mixSwitchRTs);
  const lc=(state.mixSwitchRTs.length&&state.mixRepeatRTs.length)?Math.round(sw-rep):null;
  const mc=(state.mixRepeatRTs.length&&state.pureRTs.length)?Math.round(rep-pureA):null;
  const flex=Math.round(Math.max(0,Math.min(100,
    100-(lc>0?lc/6:0)-(mc>0?mc/8:0)-state.persev*7)));
  const dt=new Date(), pad=n=>String(n).padStart(2,'0');
  lastSummary={date:dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate()),
    pace:paceKey,bgm:bgmOn,flex,lc,mc,pe:state.persev,
    rt:state.allRTs.length?Math.round(avg(state.allRTs)):null,acc,n:TOTAL};
  renderCards(resGrid,lastSummary);
  $('resNote').innerHTML=noteFor(lastSummary);
  show(resScreen);
  tone([523,659,784,1047],0.18,'triangle',0.14);
}

reset();
})();
</script>
</body>
